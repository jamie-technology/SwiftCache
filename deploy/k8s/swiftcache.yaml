# SwiftCache on k3s.
#
#   kubectl apply -f deploy/k8s/swiftcache.yaml
#
# Topology: one coordinator (StatefulSet of 1) and a StatefulSet of storage servers.
# Every `replication` storage pods form one shard; scaling the storage StatefulSet by
# `replication` pods adds a shard, and the coordinator migrates slots onto it:
#
#   kubectl -n swiftcache scale statefulset swiftcache-storage --replicas=6
#
# Storage is in-memory: a shard survives losing up to replication-1 replicas at a time.
apiVersion: v1
kind: Namespace
metadata:
  name: swiftcache
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: swiftcache-config
  namespace: swiftcache
data:
  REPLICATION: "2"
  MVCC_WINDOW_SECONDS: "10"
  COORDINATOR: "swiftcache-coordinator.swiftcache.svc.cluster.local:7400"
---
# Clients and storage servers reach the coordinator through this stable name. The
# coordinator advertises exactly this endpoint, so it must match COORDINATOR above.
apiVersion: v1
kind: Service
metadata:
  name: swiftcache-coordinator
  namespace: swiftcache
spec:
  selector:
    app.kubernetes.io/name: swiftcache
    app.kubernetes.io/component: coordinator
  ports:
    - name: swiftcache
      port: 7400
      targetPort: 7400
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: swiftcache-coordinator
  namespace: swiftcache
spec:
  serviceName: swiftcache-coordinator
  # Exactly one: the coordinator is the cluster's sequencer. A StatefulSet guarantees
  # at most one pod with this identity; on restart it recovers from storage reports.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: swiftcache
      app.kubernetes.io/component: coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swiftcache
        app.kubernetes.io/component: coordinator
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: coordinator
          image: swiftcache:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: swiftcache-config
          args:
            - coordinator
            - --listen=0.0.0.0:7400
            - --advertise=$(COORDINATOR)
            - --replication=$(REPLICATION)
            - --mvcc-window=$(MVCC_WINDOW_SECONDS)
          ports:
            - containerPort: 7400
              name: swiftcache
          readinessProbe:
            tcpSocket:
              port: 7400
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 512Mi
---
# Headless service: gives every storage pod a stable DNS name, published even before
# the pod is ready (the coordinator must reach a storage server to bring it into service).
apiVersion: v1
kind: Service
metadata:
  name: swiftcache-storage
  namespace: swiftcache
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: swiftcache
    app.kubernetes.io/component: storage
  ports:
    - name: swiftcache
      port: 7500
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: swiftcache-storage
  namespace: swiftcache
spec:
  serviceName: swiftcache-storage
  replicas: 4
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: swiftcache
      app.kubernetes.io/component: storage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swiftcache
        app.kubernetes.io/component: storage
    spec:
      terminationGracePeriodSeconds: 5
      # Spread replicas across nodes when there are several (no-op on single-node k3s).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: storage
      containers:
        - name: storage
          image: swiftcache:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: swiftcache-config
          args:
            - storage
            - --listen=0.0.0.0:7500
            - --advertise=$(POD_NAME).swiftcache-storage.swiftcache.svc.cluster.local:7500
            - --coordinator=$(COORDINATOR)
            - --mvcc-window=$(MVCC_WINDOW_SECONDS)
          ports:
            - containerPort: 7500
              name: swiftcache
          readinessProbe:
            tcpSocket:
              port: 7500
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              # The cache's capacity per replica. Add shards to grow the cluster's capacity.
              memory: 1Gi
