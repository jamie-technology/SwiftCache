# SwiftCache on k3s.
#
#   kubectl apply -f deploy/k8s/swiftcache.yaml
#
# Process layout (every pod is one SwiftCache process; the cluster assigns roles):
#
#   swiftcache-coordinator-{0,1,2}  coordinators (durable state on a PVC) that also host
#                                   stateless roles: cluster controller, master, commit
#                                   proxies, resolver. Losing one is fine; losing two
#                                   stops recoveries (the running generation keeps going).
#   swiftcache-log-{0,1,2}          transaction logs (a commit is on all of them).
#   swiftcache-storage-N            storage servers; every REPLICATION pods form a shard.
#
# Scale capacity by adding storage pods in multiples of REPLICATION:
#
#   kubectl -n swiftcache scale statefulset swiftcache-storage --replicas=6
apiVersion: v1
kind: Namespace
metadata:
  name: swiftcache
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: swiftcache-config
  namespace: swiftcache
data:
  # The "cluster file": every process and client must agree on it.
  CLUSTER: "swiftcache-coordinator-0.swiftcache.swiftcache.svc.cluster.local:4500,swiftcache-coordinator-1.swiftcache.swiftcache.svc.cluster.local:4500,swiftcache-coordinator-2.swiftcache.swiftcache.svc.cluster.local:4500"
  REPLICATION: "2"
  LOGS: "3"
  # One commit proxy, recruited onto the master's process: its version/resolution round
  # trip is then local. Best for small clusters (~1.5x set throughput at 32 clients on a 4-vCPU
  # node vs 2 proxies); raise it when proxy CPU becomes the limit.
  PROXIES: "1"
  MVCC_WINDOW_SECONDS: "10"
---
# One headless service gives every pod a stable DNS name
# (<pod>.swiftcache.swiftcache.svc.cluster.local), published before the pod is ready:
# processes must reach each other to become ready.
apiVersion: v1
kind: Service
metadata:
  name: swiftcache
  namespace: swiftcache
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: swiftcache
  ports:
    - name: swiftcache
      port: 4500
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: swiftcache-coordinator
  namespace: swiftcache
spec:
  serviceName: swiftcache
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app.kubernetes.io/name: swiftcache, app.kubernetes.io/component: coordinator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: swiftcache, app.kubernetes.io/component: coordinator}
    spec:
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 10001
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway,
           labelSelector: {matchLabels: {app.kubernetes.io/component: coordinator}}}
      containers:
        - name: swiftcache
          image: swiftcache:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          envFrom:
            - configMapRef: {name: swiftcache-config}
          args:
            - --class=stateless
            - --coordinator
            - --data-dir=/data
            - --listen=0.0.0.0:4500
            - --advertise=$(POD_NAME).swiftcache.swiftcache.svc.cluster.local:4500
            - --coordinators=$(CLUSTER)
            - --replication=$(REPLICATION)
            - --logs=$(LOGS)
            - --proxies=$(PROXIES)
            - --mvcc-window=$(MVCC_WINDOW_SECONDS)
          ports:
            - {containerPort: 4500, name: swiftcache}
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /live, port: 8080}
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - {name: data, mountPath: /data}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 512Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 64Mi}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: swiftcache-log
  namespace: swiftcache
spec:
  serviceName: swiftcache
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app.kubernetes.io/name: swiftcache, app.kubernetes.io/component: log}
  template:
    metadata:
      labels: {app.kubernetes.io/name: swiftcache, app.kubernetes.io/component: log}
    spec:
      terminationGracePeriodSeconds: 5
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway,
           labelSelector: {matchLabels: {app.kubernetes.io/component: log}}}
      containers:
        - name: swiftcache
          image: swiftcache:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          envFrom:
            - configMapRef: {name: swiftcache-config}
          args:
            - --class=log
            - --listen=0.0.0.0:4500
            - --advertise=$(POD_NAME).swiftcache.swiftcache.svc.cluster.local:4500
            - --coordinators=$(CLUSTER)
            - --replication=$(REPLICATION)
            - --logs=$(LOGS)
            - --proxies=$(PROXIES)
            - --mvcc-window=$(MVCC_WINDOW_SECONDS)
          ports:
            - {containerPort: 4500, name: swiftcache}
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /live, port: 8080}
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 1Gi}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: swiftcache-storage
  namespace: swiftcache
spec:
  serviceName: swiftcache
  replicas: 4
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app.kubernetes.io/name: swiftcache, app.kubernetes.io/component: storage}
  template:
    metadata:
      labels: {app.kubernetes.io/name: swiftcache, app.kubernetes.io/component: storage}
    spec:
      terminationGracePeriodSeconds: 5
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway,
           labelSelector: {matchLabels: {app.kubernetes.io/component: storage}}}
      # Rolling updates wait for /ready, which a storage pod reports only once its replica
      # has re-copied its shard's data: one shard never loses two replicas to a rollout.
      containers:
        - name: swiftcache
          image: swiftcache:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          envFrom:
            - configMapRef: {name: swiftcache-config}
          args:
            - --class=storage
            - --listen=0.0.0.0:4500
            - --advertise=$(POD_NAME).swiftcache.swiftcache.svc.cluster.local:4500
            - --coordinators=$(CLUSTER)
            - --replication=$(REPLICATION)
            - --logs=$(LOGS)
            - --proxies=$(PROXIES)
            - --mvcc-window=$(MVCC_WINDOW_SECONDS)
          ports:
            - {containerPort: 4500, name: swiftcache}
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /live, port: 8080}
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits:
              # Each replica's share of the cache. Add shards to grow total capacity.
              memory: 1Gi
